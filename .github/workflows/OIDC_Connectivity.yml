name: Check JFROG Connectivity using OIDC

on:
  workflow_dispatch: # Trigger the workflow manually

jobs:
  build-and-github-publish:
    runs-on: ubuntu-latest # Use the latest Ubuntu runner
    env:
      OIDC_PROVIDER: "koerber-design-system-github-oidc" # OIDC provider name for JFrog
      OIDC_AUDIENCE: "koerber-design-system-github-oidc"
      #OIDC_PROVIDER: "testgithub"
      #OIDC_AUDIENCE: "testgithub"
      JF_URL: "https://krbr.jfrog.io"
      JF_PROJECT: "koerber-design"
      PLATFORM_REPO: "koerber-design-system"
      NODE_VERSION: 22.x
      JFROG_CLI_LOG_LEVEL: DEBUG
    defaults:
      run:
        working-directory: ./package # All subsequent 'run' commands will execute in this directory

    permissions:
      contents: read # Allow reading repository content
      packages: write # Allow writing to GitHub Packages
      id-token: write # Required for OIDC authentication with JFrog

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4 # Action to check out your repository code


      - name: Setup JFrog CLI
        uses: jfrog/setup-jfrog-cli@v3
        id: setup-cli-main
        env:
          JF_URL: ${{ env.JF_URL }}
          JF_PROJECT: ${{ env.JF_PROJECT }}
        with:
          oidc-provider-name: ${{ env.OIDC_PROVIDER }}
          oidc-audience: ${{ env.OIDC_AUDIENCE }}

      #- name: Debug OIDC Claims
      #  uses: github/actions-oidc-debugger@main
      #  with:
      #    audience: '${{ github.server_url }}/${{ github.repository_owner }}'

      - name: Check Connectivity
        run: |
          jf rt ping

      - name: Get ID token
        shell: bash
        run: |
          ID_TOKEN=$(curl -sLS -H "User-Agent: actions/oidc-client" -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${{ env.OIDC_AUDIENCE }}" | jq .value | tr -d '"')
          echo "ID_TOKEN=${ID_TOKEN}" >> $GITHUB_OUTPUT
          echo "ID_TOKEN=${ID_TOKEN}" >> $GITHUB_ENV             
          echo "TOKEN=${ID_TOKEN}"
          
      - name: Exchange ID token with access
        shell: bash
        id: token
        env:
          ID_TOKEN: ${{ env.ID_TOKEN }}
        run: |          
          ACCESS_TOKEN1=$(curl -XPOST "${{ env.JF_URL }}/access/api/v1/oidc/token" -H "Content-Type: application/json" -d "{\"grant_type\": \"urn:ietf:params:oauth:grant-type:token-exchange\", \"subject_token_type\":\"urn:ietf:params:oauth:token-type:id_token\", \"subject_token\": \"$ID_TOKEN\", \"provider_name\": \"${{ env.OIDC_PROVIDER }}\"}")
          echo ${ACCESS_TOKEN1}
          ACCESS_TOKEN1_VALUE=$(echo $ACCESS_TOKEN1 | jq -r '.access_token')
          echo "ACCESS_TOKEN1_VALUE=${ACCESS_TOKEN1_VALUE}" >> $GITHUB_ENV
          ACCESS_TOKEN1_USER=$(echo $ACCESS_TOKEN1 | jq -r '.username')
          echo "access_token=${ACCESS_TOKEN1_VALUE}"
          echo "username=${ACCESS_TOKEN1_USER}"
          

      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: ''
          scope: '@koerber-design-system'
          cache: 'yarn'
          cache-dependency-path: './package/yarn.lock'

      - name: Set Yarn to v2.4.0 or later
        run: |
          corepack enable
          corepack prepare yarn@2.4.0 --activate

      #- name: Configure Yarn to JFROG NPM Registry
      #  run: jf yarn-config --repo-resolve ${{ env.PLATFORM_REPO }}
      # Use `yarn install` directly with the access token, and then `jf rt build-publish` to collect the build info    
        
      - name: Build prod
        run: |
            # Create the .npmrc file with the new token
            echo "Creating .npmrc file with the access token..."
      
            echo "Creating .npmrc file with the access token..."
            echo "email = anilkt@jfrog.com" > .npmrc
            echo "always-auth = true" >> .npmrc
            echo "registry = https://krbr.jfrog.io/artifactory/api/npm/koerber-design-system/" >> .npmrc
            echo "//krbr.jfrog.io/artifactory/api/npm/koerber-design-system/:_authToken=${{ steps.setup-cli-main.outputs.oidc-token }}" >> .npmrc
                        

            echo ".npmrc file created."
        
            # Output the path to the created .npmrc file
            echo "NPM_CONFIG_FILE=$(pwd)/.npmrc" >> $GITHUB_ENV
            cat "$(pwd)/.npmrc"
            yarn install

      - name: Publish Build info With JFrog CLI
        run: |
          # Collect environment variables for the build
          jf rt build-collect-env koerber-design ${{ github.run_number }} --project ${{ env.JF_PROJECT }}
          # Collect VCS details from git and add them to the build
          jf rt build-add-git koerber-design ${{ github.run_number }} --project ${{ env.JF_PROJECT }}
          # Publish build info 
          jf rt build-publish koerber-design ${{ github.run_number }} --project ${{ env.JF_PROJECT }}
