name: Publish NPM Package to GitHub Packages

on:
  workflow_dispatch: # Trigger the workflow manually

jobs:
  build-and-github-publish:
    runs-on: ubuntu-latest # Use the latest Ubuntu runner
    defaults:
      run:
        working-directory: ./package # All subsequent 'run' commands will execute in this directory

    permissions:
      contents: read # Allow reading repository content
      packages: write # Allow writing to GitHub Packages

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4 # Action to check out your repository code

      - name: Set up Node.js
        uses: actions/setup-node@v4 # Action to set up Node.js environment
        with:
          node-version: '20.x' # Specify the Node.js version to use
          registry-url: 'https://npm.pkg.github.com/' # Configure npm to use GitHub Packages registry
          # IMPORTANT: The 'scope' here MUST match the scope in your package.json's 'name' field.
          # For example, if your package name is "@koerber-design-system/my-lib", this scope is correct.
          scope: '@koerber-design-system'

      - name: Create .npmrc for GitHub Packages and general auth
        # This step creates a .npmrc file within the working directory (./package).
        # It configures authentication for both your scoped GitHub Packages registry
        # and provides a token for the default npm registry (registry.npmjs.org)
        # to handle any potential interactions there (e.g., fetching public dependencies).
        run: |
          # Directs packages under @koerber-design-system to GitHub Packages
          echo "@koerber-design-system:registry=https://npm.pkg.github.com/" > .npmrc
          # Provides authentication token for GitHub Packages
          echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" >> .npmrc
          # Provides authentication token for the public npm registry, in case it's accessed
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" >> .npmrc
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Use the GitHub Actions token for authentication

      - name: Install dependencies
        run: npm install # Install all project dependencies

      - name: Test project
        # Assuming you have a 'test' script defined in your package.json
        run: npm test # Run the test script for your project

      - name: Publish package
        run: npm publish # Publish the package to the configured registry
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
